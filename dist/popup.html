<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask Gemini</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-title">
        <svg class="gemini-sparkle" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 0C12 6.62742 6.62742 12 0 12C6.62742 12 12 17.3726 12 24C12 17.3726 17.3726 12 24 12C17.3726 12 12 6.62742 12 0Z" fill="url(#sparkle_grad)"/>
          <defs>
            <linearGradient id="sparkle_grad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
              <stop stop-color="#4E95FF"/>
              <stop offset="0.5" stop-color="#9358F7"/>
              <stop offset="1" stop-color="#FF70A6"/>
            </linearGradient>
          </defs>
        </svg>
        <h1>Ask Gemini Bridge</h1>
      </div>
      <span id="statusBadge" class="badge idle">Idle</span>
    </header>

    <main class="main">
      <div class="field-group">
        <label for="promptInput">Prompt</label>
        <textarea id="promptInput" placeholder="Enter your prompt here..." rows="4"></textarea>
      </div>

      <button id="askBtn" class="btn-primary">
        <span>Ask Gemini</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>

      <div class="field-group response-group">
        <div class="response-header">
          <label>Response</label>
          <span id="charCount" class="char-count">0 chars</span>
        </div>
        <div id="responseBox" class="response-box placeholder">
          Response will appear here...
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
